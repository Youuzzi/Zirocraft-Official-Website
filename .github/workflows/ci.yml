name: Website CI

on:
  pull_request:
    branches: [main, feature/official-site-rebuild]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: NEXT_PUBLIC_SITE_URL=https://example.test npm run build

      - name: Smoke test production routes
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/zirocraft-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          npm run test:smoke
